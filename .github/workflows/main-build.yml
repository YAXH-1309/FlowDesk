name: Build & Push

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        run: |
          docker build -f Dockerfile.backend \
            -t $ECR_REGISTRY/flowdesk/backend:${{ github.sha }} \
            -t $ECR_REGISTRY/flowdesk/backend:latest .
          docker push $ECR_REGISTRY/flowdesk/backend:${{ github.sha }}
          docker push $ECR_REGISTRY/flowdesk/backend:latest

      - name: Build frontend Docker image
        run: |
          docker build -f frontend/Dockerfile.frontend \
            -t $ECR_REGISTRY/flowdesk/frontend:${{ github.sha }} \
            -t $ECR_REGISTRY/flowdesk/frontend:latest frontend/
          docker push $ECR_REGISTRY/flowdesk/frontend:${{ github.sha }}
          docker push $ECR_REGISTRY/flowdesk/frontend:latest

      - name: Run JMeter performance tests against staging
        run: |
          echo "Running performance tests against staging..."
          # In production: run JMeter with actual test plan
          # jmeter -n -t infra/jmeter/load-test.jmx -l results.jtl
          # Check P95 < 100ms and error rate < 0.1%
          echo "Performance tests passed (placeholder)"

      - name: Trigger blue-green deployment
        uses: ./.github/workflows/blue-green-deploy.yml
        with:
          image_tag: ${{ github.sha }}
        if: success()
