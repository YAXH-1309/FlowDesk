name: PR Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flowdesk_test
          POSTGRES_USER: flowdesk
          POSTGRES_PASSWORD: flowdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Unit & Integration Tests
        run: ./gradlew test --no-daemon
        env:
          DB_PRIMARY_URL: jdbc:postgresql://localhost:5432/flowdesk_test
          DB_REPLICA0_URL: jdbc:postgresql://localhost:5432/flowdesk_test
          DB_REPLICA1_URL: jdbc:postgresql://localhost:5432/flowdesk_test
          DB_REPLICA2_URL: jdbc:postgresql://localhost:5432/flowdesk_test
          DB_USERNAME: flowdesk
          DB_PASSWORD: flowdesk
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      - name: SAST — SpotBugs
        run: ./gradlew spotbugsMain --no-daemon
        continue-on-error: false

      - name: Frontend lint & build
        working-directory: frontend
        run: |
          npm ci --silent
          npm run lint
          npm run build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/'
