spring:
  datasource:
    primary:
      jdbc-url: ${DB_PRIMARY_URL:jdbc:postgresql://localhost:5432/flowdesk}
      username: ${DB_USERNAME:flowdesk}
      password: ${DB_PASSWORD:flowdesk}
      driver-class-name: org.postgresql.Driver
    replica0:
      jdbc-url: ${DB_REPLICA0_URL:jdbc:postgresql://localhost:5433/flowdesk}
      username: ${DB_USERNAME:flowdesk}
      password: ${DB_PASSWORD:flowdesk}
      driver-class-name: org.postgresql.Driver
    replica1:
      jdbc-url: ${DB_REPLICA1_URL:jdbc:postgresql://localhost:5434/flowdesk}
      username: ${DB_USERNAME:flowdesk}
      password: ${DB_PASSWORD:flowdesk}
      driver-class-name: org.postgresql.Driver
    replica2:
      jdbc-url: ${DB_REPLICA2_URL:jdbc:postgresql://localhost:5435/flowdesk}
      username: ${DB_USERNAME:flowdesk}
      password: ${DB_PASSWORD:flowdesk}
      driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: core_schema
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope: openid,email,profile
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/callback"
        provider:
          google:
            issuer-uri: https://accounts.google.com
    saml2:
      relyingparty:
        registration:
          okta:
            assertingparty:
              metadata-uri: ${SAML_METADATA_URI:}
            acs:
              location: "{baseUrl}/api/v1/auth/saml/acs"
            signing:
              credentials:
                - private-key-location: ${SAML_PRIVATE_KEY:classpath:saml/private.key}
                  certificate-location: ${SAML_CERTIFICATE:classpath:saml/public.crt}

app:
  jwt:
    # Base64-encoded 256-bit secret — override via APP_JWT_SECRET env var in production
    secret: ${APP_JWT_SECRET:bXktc3VwZXItc2VjcmV0LWtleS10aGF0LWlzLWF0LWxlYXN0LTMyLWJ5dGVzLWxvbmch}
    expiration-ms: 86400000  # 24 hours
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
