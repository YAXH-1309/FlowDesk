apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowdesk-backend
  namespace: flowdesk
  labels:
    app: flowdesk-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flowdesk-backend
  template:
    metadata:
      labels:
        app: flowdesk-backend
    spec:
      containers:
        - name: backend
          image: ${ECR_REGISTRY}/flowdesk/backend:${IMAGE_TAG}
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          env:
            - name: DB_PRIMARY_URL
              valueFrom:
                secretKeyRef:
                  name: flowdesk-secrets
                  key: db-primary-url
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: flowdesk-secrets
                  key: jwt-secret
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flowdesk-backend-hpa
  namespace: flowdesk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flowdesk-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flowdesk-backend-netpol
  namespace: flowdesk
spec:
  podSelector:
    matchLabels:
      app: flowdesk-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: flowdesk-frontend
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - protocol: TCP
          port: 9092
    # Allow DNS
    - ports:
        - protocol: UDP
          port: 53
